# Trecho para o arquivo de configuração do site no aaPanel
# (Website → <site> → Config). Cole DENTRO do bloco "server { ... }" que
# escuta a porta 443, depois das linhas de SSL que o aaPanel criou.
# Guia: docs/DEPLOY-AAPANEL.md, passo 7.
#
# Antes, APAGUE do mesmo arquivo os dois blocos de cache de arquivos que o
# aaPanel cria em todo site (senão ele procura /assets e /storage no disco
# do site e responde 404):
#   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { ... }
#   location ~ .*\.(js|css)?$ { ... }

# Não anuncia a versão do nginx nas respostas e páginas de erro.
server_tokens off;

# Robôs procurando arquivos sensíveis (/.env, /.git, wp-login.php...) param
# aqui mesmo, sem chegar ao SerTec Food. /.well-known continua livre (SSL).
location ~* (^|/)\.(?!well-known/) { return 404; }
location ~* (\.(php|phtml|env|ini|sql|bak|old|swp)$|^/(wp-|wordpress|xmlrpc|cgi-bin/|phpmyadmin|pma/|vendor/|node_modules/|server-status|actuator)) { return 404; }

# Enquanto o SerTec Food reinicia (deploy) ou se ele cair, o visitante vê
# "Voltamos em instantes" em vez da página padrão do nginx. O arquivo vem
# do próprio repositório; atualiza junto com o git pull.
error_page 502 503 504 /__sertec_indisponivel.html;
location = /__sertec_indisponivel.html {
    internal;
    default_type text/html;
    alias /opt/sertec-food/docker/caddy/erros/indisponivel.html;
    add_header Cache-Control "no-store" always;
}

location / {
    # Anti-abuso (opcional, recomendado): ative as duas linhas abaixo DEPOIS de
    # criar as zonas no nginx.conf (docs/DEPLOY-AAPANEL.md, "Proteção extra").
    # limit_req zone=sertec_req burst=60 nodelay;
    # limit_conn sertec_conn 40;

    # Conexões lentas de propósito (slowloris) são derrubadas.
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Substitui (não acrescenta) o X-Forwarded-For: o SerTec Food recebe só
    # o IP real do visitante, sem nada que ele mesmo tenha mandado.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    # Fotos de produto: até 10 MB (igual ao PHP).
    client_max_body_size 12m;
}
