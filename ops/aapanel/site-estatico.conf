# Trecho para SITES ESTÁTICOS de clientes no aaPanel (ex.: yriscakes.com.br).
# Website → <site> → Config: cole DENTRO do bloco "server { ... }" da porta 443,
# depois das linhas de SSL. Salve; o aaPanel testa e recarrega o nginx.
#
# O que faz:
# - cabeçalhos de segurança (HTTPS obrigatório, anti-clickjacking, CSP);
# - bloqueia varreduras de robôs (/.env, /.git, wp-login.php...);
# - usa as páginas de erro com a marca do cliente (pasta /erros do site).
#
# Ajuste por cliente: o endereço da loja SerTec Food no Content-Security-Policy
# (img-src e connect-src). Se o site ligar o Google Analytics (config.js),
# acrescente https://www.googletagmanager.com em script-src e
# https://*.google-analytics.com https://*.analytics.google.com em connect-src.
#
# Atenção: no aaPanel, se algum "location" deste site tiver add_header, os
# cabeçalhos abaixo deixam de valer dentro dele (regra do nginx). Os blocos
# padrão de cache do aaPanel usam "expires" e não têm esse problema.

server_tokens off;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://loja.yriscakes.com.br; connect-src 'self' https://loja.yriscakes.com.br; script-src 'self'; style-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Varreduras: arquivos ocultos (menos /.well-known, usado pelo SSL) e
# extensões que um site estático nunca serve.
location ~* (^|/)\.(?!well-known/) { return 404; }
location ~* (\.(php|phtml|env|ini|sql|bak|old|swp|log)$|^/(wp-|wordpress|xmlrpc|cgi-bin/|phpmyadmin|pma/|vendor/|node_modules/|server-status)) { return 404; }

# Páginas de erro com a marca do cliente. Apague (ou comente) as linhas
# "error_page" que o aaPanel cria entre #ERROR-PAGE-START e #ERROR-PAGE-END.
error_page 400 /erros/400.html;
error_page 403 /erros/403.html;
error_page 404 /erros/404.html;
error_page 429 /erros/429.html;
error_page 500 /erros/500.html;
error_page 502 /erros/502.html;
error_page 503 /erros/503.html;
error_page 504 /erros/504.html;
