name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, testes de isolamento)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sertec_food_test
          MARIADB_USER: sertec
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sertec_food_test
      DB_USERNAME: sertec
      DB_PASSWORD: ci-only-password
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, intl, bcmath, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock', 'backend/composer.json') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migrations + rollback completo (Definition of Done)
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force --seed

      - name: Pest (feature, isolamento, arquitetura)
        run: vendor/bin/pest --ci

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker (config válida)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=x/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=y/' .env
      - run: docker compose config --quiet
      - run: docker compose build php
      - name: Produção — compose válido
        run: |
          cp .env.production.example .env.production
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=x/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=y/' .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          # Variante atrás do aaPanel: portas só locais e Caddyfile.proxy.
          WEB_HTTP_BIND=127.0.0.1:8088 WEB_HTTPS_BIND=127.0.0.1:8443 CADDY_CONFIG=Caddyfile.proxy \
            docker compose -f docker-compose.prod.yml --env-file .env.production config > aapanel.yml
          grep -q 'host_ip: 127.0.0.1' aapanel.yml && grep -q 'Caddyfile.proxy' aapanel.yml
      - name: Produção — Caddyfiles válidos
        run: |
          for f in Caddyfile Caddyfile.proxy; do
            docker run --rm -e ACME_EMAIL=a@b.c -e TENANCY_ADMIN_HOST=admin.example.com -v "$PWD/docker/caddy/$f:/etc/caddy/$f:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/$f --adapter caddyfile
          done
      - name: Produção — imagens (app e web)
        shell: bash
        run: |
          set -o pipefail
          if ! docker compose -f docker-compose.prod.yml --env-file .env.production build --progress=plain app web 2>&1 | tee build.log; then
            # Resumo do erro como anotação (visível sem baixar o log completo).
            echo "::error title=Build de produção falhou::$(grep -vE '^#[0-9]+ (sha256|extracting|resolve|DONE)' build.log | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          fi
      - name: Produção atrás do Nginx (aaPanel) — teste de fumaça
        shell: bash
        run: |
          set -euo pipefail
          sf() { docker compose -f docker-compose.prod.yml --env-file .env.production "$@"; }
          sed -i 's/^TENANCY_BASE_DOMAIN=.*/TENANCY_BASE_DOMAIN=cardapios.example.test/; s/^TENANCY_ADMIN_HOST=.*/TENANCY_ADMIN_HOST=admin.cardapios.example.test/' .env.production
          printf 'WEB_HTTP_BIND=127.0.0.1:8088\nWEB_HTTPS_BIND=127.0.0.1:8443\nCADDY_CONFIG=Caddyfile.proxy\n' >> .env.production
          key=$(sf run --rm --no-deps -T -e SERTEC_SKIP_CACHE=1 app php artisan key:generate --show | grep -o 'base64:[A-Za-z0-9+/=]*')
          sed -i "s|^APP_KEY=.*|APP_KEY=$key|" .env.production
          sf up -d app web
          for i in $(seq 1 40); do sf exec -T app php artisan migrate --force && break; sleep 3; done
          for c in PermissionSeeder RoleSeeder PlanSeeder; do sf exec -T app php artisan db:seed --class=$c --force; done
          sf exec -T app php artisan tenant:create demo "Demo" --owner-email=dono@example.test --owner-name=Dono --activate
          # Nginx como o do aaPanel: repassa para 127.0.0.1:8088 acrescentando X-Forwarded-For.
          cat > /tmp/aapanel.conf <<'EOF'
          server {
            listen 127.0.0.1:8099;
            location / {
              proxy_pass http://127.0.0.1:8088;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
            }
          }
          EOF
          docker run -d --name aapanel --network host -v /tmp/aapanel.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine
          sleep 2
          fail() {
            diag=$( { echo "$1"; echo '--- direto no Caddy:'; curl -sS -i -H 'Host: demo.cardapios.example.test' http://127.0.0.1:8088/ | head -c 600; echo; echo '--- logs:'; sf logs --no-color --tail 25 web app 2>&1 | cut -c1-300; } | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Atrás do aaPanel::$diag"; exit 1
          }
          A='Host: admin.cardapios.example.test'
          # Laravel de verdade (o Caddy responde 200 vazio quando não repassa ao PHP).
          curl -fsS -H "$A" http://127.0.0.1:8099/up | grep -q 'SerTec Food' || fail 'health /up não chegou ao Laravel'
          curl -fsSI -H "$A" http://127.0.0.1:8099/ | grep -qi '^content-security-policy:' || fail 'painel SerTec sem CSP'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "$A" 'http://127.0.0.1:8099/api/v1/internal/tls-ask?domain=x')" = 404 ] || fail 'rota interna exposta'
          html=$(curl -sS -w '\nHTTP %{http_code}' -H 'Host: demo.cardapios.example.test' http://127.0.0.1:8099/)
          grep -q 'rel="canonical" href="https://demo.cardapios.example.test/"' <<<"$html" || fail "PHP não recebeu HTTPS: $(grep -oE '<link rel=\"canonical\"[^>]*>|<title>[^<]*</title>|HTTP [0-9]+' <<<"$html" | tr '\n' ' ')$(head -c 300 <<<"$html" | tr '\n' ' ')"
          # Visitante 203.0.113.9 forjando X-Forwarded-For: 6.6.6.6 (o Nginx acrescenta o IP real à direita).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$A" -H 'Sec-Fetch-Site: same-origin' -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H 'X-Forwarded-For: 6.6.6.6, 203.0.113.9' -d '{"email":"ninguem@example.test","password":"senha-errada-123"}' http://127.0.0.1:8088/api/v1/admin/auth/login)
          [ "$code" != 419 ] && [ "$code" -ge 400 ] || fail "login respondeu $code"
          ip=$(sf exec -T mariadb mariadb -usertec -px sertec_food -N -e "select ip from audit_logs where action='auth.platform.login_failed' order by id desc limit 1")
          [ "$ip" = 203.0.113.9 ] || fail "IP registrado: '$ip' (esperado 203.0.113.9)"
          sf down -v
      - name: Scripts de operação (sintaxe)
        run: for f in ops/*.sh; do bash -n "$f"; done
