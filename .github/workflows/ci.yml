name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, testes de isolamento)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sertec_food_test
          MARIADB_USER: sertec
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sertec_food_test
      DB_USERNAME: sertec
      DB_PASSWORD: ci-only-password
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, intl, bcmath, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock', 'backend/composer.json') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migrations + rollback completo (Definition of Done)
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force --seed

      - name: Pest (feature, isolamento, arquitetura)
        run: vendor/bin/pest --ci

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker (config válida)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=x/; s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=y/' .env
      - run: docker compose config --quiet
      - run: docker compose build php
