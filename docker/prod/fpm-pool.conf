[www]
; Ajuste conforme a memória do servidor (~40 MB por processo).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
; Logs do PHP vão para stderr do container.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
; Requisição travada (ou ataque lento) não prende o processo para sempre.
request_terminate_timeout = 60s
