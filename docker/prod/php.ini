date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off
display_errors = Off
log_errors = On
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
session.use_strict_mode = 1
; Camada extra contra php2shell (CVE-2026-109619): recurso não usado pelo sistema.
session.upload_progress.enabled = 0
; Sem includes remotos nem funções de shell. proc_open fica: o agendador usa.
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,pcntl_exec,dl
