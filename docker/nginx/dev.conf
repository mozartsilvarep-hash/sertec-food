# Nginx de desenvolvimento: cada host serve SPA + API na MESMA origem.
#   admin.cardapios.localhost            -> painel SerTec (Vite :5175) + /api
#   {slug}.cardapios.localhost/          -> cardápio (Vite :5173) + /api
#   {slug}.cardapios.localhost/painel/   -> painel do restaurante (Vite :5174)
# *.localhost resolve para 127.0.0.1 nos navegadores modernos (sem /etc/hosts).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cabeçalhos de segurança básicos (CSP completa: Sprint 5).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

server {
    listen 80;
    server_name admin.cardapios.localhost;

    include /etc/nginx/snippets/sertec-api.conf;

    location / {
        include /etc/nginx/snippets/sertec-vite.conf;
        proxy_pass http://node:5175;
    }
}

server {
    listen 80 default_server;
    server_name _;   # subdomínios de tenants e domínios próprios

    include /etc/nginx/snippets/sertec-api.conf;

    location /painel/ {
        include /etc/nginx/snippets/sertec-vite.conf;
        proxy_pass http://node:5174;
    }

    location / {
        include /etc/nginx/snippets/sertec-vite.conf;
        proxy_pass http://node:5173;
    }
}
