client_max_body_size 12m;

location ^~ /api/ {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    # Correlação de logs: o Laravel reaproveita este ID (AssignRequestId).
    # Vai num parâmetro próprio: o cabeçalho X-Request-Id do cliente chega
    # intacto (o Mercado Pago o usa na assinatura do webhook).
    fastcgi_param SERTEC_REQUEST_ID $request_id;
}

# Fotos do catálogo (WebP reencodado pelo backend). Nada executável aqui.
location ^~ /storage/ {
    alias /var/www/backend/storage/app/public/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    location ~ \.php$ { return 404; }
}

location = /up {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
}
